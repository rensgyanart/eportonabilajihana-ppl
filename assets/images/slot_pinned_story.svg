<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a201c"/>
      <stop offset="100%" stop-color="#111613"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  <rect width="800" height="900" fill="url(#grid)"/>
  <rect x="20" y="20" width="760" height="860" rx="20" fill="none" stroke="#cefe1e" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
  
  <g transform="translate(400.0, 400.0)">
    <!-- Camera/Image Icon -->
    <rect x="-45" y="-35" width="90" height="70" rx="14" fill="#cefe1e" opacity="0.15"/>
    <rect x="-45" y="-35" width="90" height="70" rx="14" fill="none" stroke="#cefe1e" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#cefe1e" stroke-width="2.5"/>
    <circle cx="24" cy="-18" r="4.5" fill="#cefe1e"/>
    <path d="M -15 -35 L -10 -45 L 10 -45 L 15 -35" fill="none" stroke="#cefe1e" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400.0, 490.0)">
    <rect x="-180" y="0" width="360" height="32" rx="16" fill="#cefe1e"/>
    <text x="0" y="21" fill="#141815" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">SLOT FOTO / GAMBAR TEMPLATE</text>
  </g>

  <!-- Specific Slot Label -->
  <text x="400.0" y="545.0" fill="#ffffff" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Foto Bimbingan & Kolaborasi</text>
  <text x="400.0" y="572.0" fill="rgba(255,255,255,0.7)" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Sesi Pembinaan Bersama Guru Pamong / DPL</text>
  <text x="400.0" y="598.0" fill="#cefe1e" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Rekomendasi: Format Square / Portrait 4:5 (Min. 800 x 900 px)</text>
</svg>